spring.application.name=backend
spring.main.lazy-initialization=true
# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://db:5432/untold_festival
spring.datasource.username=untold
spring.datasource.password=admin
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate / JPA configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false
spring.jpa.properties.hibernate.transaction.jta.platform=org.hibernate.engine.transaction.jta.platform.internal.NoJtaPlatform

# Disable JMX to speed up startup
spring.jmx.enabled=false


# Flyway configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.url=jdbc:postgresql://db:5432/untold_festival
spring.flyway.user=untold
spring.flyway.password=admin

# Stripe configuration (test mode)
# Replace with your actual Stripe TEST keys from https://dashboard.stripe.com/test/apikeys
stripe.secret-key=CHEIE_STRIPE_TEST_AICI
stripe.webhook-secret=whsec_YOUR_WEBHOOK_SECRET_HERE

# JWT Configuration
app.jwt.secret=YOUR_JWT_SECRET_KEY_HERE
app.jwt.expiration-ms=86400000

# Dynamic QR signing (anti-screenshot rotating ticket codes) — separate secret from JWT so
# rotating one doesn't invalidate the other.
app.qr.secret=YOUR_QR_SIGNING_SECRET_KEY_HERE

# Multipart File Upload Configuration
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB

# Flash Sale Configuration
# Set the open datetime in ISO format: yyyy-MM-ddTHH:mm:ss
flash.sale.open.datetime=2026-07-26T10:00:00
# Total number of discounted tickets available in the flash sale
flash.sale.total.tickets=2

spring.flyway.placeholders.totaltickets=${flash.sale.total.tickets}

# Festival dates: Day 1 = this date (Europe/Bucharest); the festival runs 4 consecutive days from here.
festival.start-date=2026-07-20

# =========================
# Kafka (entrance events -> live stats)
# =========================
spring.kafka.bootstrap-servers=kafka:9092
spring.kafka.consumer.group-id=untold-backend
# Live stats only care about what happens from now on; replaying old entrance events on startup
# would flood freshly-connected clients with stale counts.
spring.kafka.consumer.auto-offset-reset=latest
# Never let a Kafka outage block the scan path: give up on publishing quickly instead of the
# default 60s block, the scan itself must still succeed.
spring.kafka.producer.properties.max.block.ms=2000

# =========================
# Observability (Actuator / Micrometer / Prometheus)
# =========================
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.metrics.tags.application=${spring.application.name}
# HTTP request latency histogram + percentiles, so Grafana can chart p95/p99, not just averages.
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.percentiles.http.server.requests=0.5,0.95,0.99
# HikariCP pool metrics (active/idle connections) are auto-registered once actuator is on the classpath.
spring.datasource.hikari.pool-name=UntoldHikariPool
